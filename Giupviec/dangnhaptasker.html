<script>
(function() {
  // Gán id cho các input (chưa có id trong HTML gốc)
  var inputs = document.querySelectorAll('main input');
  if (inputs[0]) inputs[0].id = 'taskerPhone';
  if (inputs[1]) inputs[1].id = 'taskerPassword';
  if (inputs[2]) inputs[2].id = 'tasker2FA';

  // Gán id cho error messages
  var errorDivs = document.querySelectorAll('.text-error.text-body-sm');
  var errorBox = document.querySelector('.flex.items-start.gap-2.bg-errorbg-surface-container\\/30');
  var infoBox = document.querySelector('.flex.items-start.gap-2.bg-tertiarybg-surface-container\\/10');
  if (errorBox) { errorBox.id = 'loginError'; errorBox.style.display = 'none'; }
  if (infoBox) { infoBox.id = 'loginInfo'; infoBox.style.display = 'none'; }

  // Gán sự kiện cho nút ĐĂNG NHẬP
  var loginBtn = document.querySelector('button.primary-gradient');
  if (loginBtn) {
    loginBtn.id = 'taskerLoginBtn';
    loginBtn.addEventListener('click', handleTaskerLogin);
  }

  // Enter key trên password
  var passInput = document.getElementById('taskerPassword');
  if (passInput) {
    passInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleTaskerLogin();
    });
  }

  async function handleTaskerLogin() {
    var phone = document.getElementById('taskerPhone').value.trim();
    var pass = document.getElementById('taskerPassword').value.trim();
    var errorBox = document.getElementById('loginError');
    var infoBox = document.getElementById('loginInfo');
    var btn = document.getElementById('taskerLoginBtn');

    if (!phone || !pass) {
      if (errorBox) {
        errorBox.querySelector('p').textContent = 'Vui lòng nhập số điện thoại và mật khẩu.';
        errorBox.style.display = 'flex';
      }
      return;
    }

    // UI loading
    btn.disabled = true;
    btn.textContent = 'Đang đăng nhập...';
    if (errorBox) errorBox.style.display = 'none';
    if (infoBox) infoBox.style.display = 'none';

    try {
      var data = await apiFetch('/api/auth/login', {
        method: 'POST',
        body: { phone: phone, password: pass }
      });

      ChiOiAuth.saveLogin(data);

      var user = ChiOiAuth.getUser();

      // Kiểm tra role
      if (user && user.role === 'TASKER') {
        // Kiểm tra KYC status (nếu chưa verified, hiện thông báo)
        if (user.kyc_status && user.kyc_status === 'PENDING_APPROVAL') {
          if (infoBox) {
            infoBox.querySelector('p').textContent = 'Tài khoản đang chờ Admin phê duyệt KYC.';
            infoBox.style.display = 'flex';
          }
          btn.disabled = false;
          btn.textContent = 'ĐĂNG NHẬP';
          return;
        }
        window.location.href = 'trangchutasker.html';
      } else {
        // Nếu không phải TASKER, báo lỗi
        ChiOiAuth.logout();
        if (errorBox) {
          errorBox.querySelector('p').textContent = 'Tài khoản này không phải Tasker. Vui lòng dùng app Cư dân.';
          errorBox.style.display = 'flex';
        }
        btn.disabled = false;
        btn.textContent = 'ĐĂNG NHẬP';
      }
    } catch (err) {
      if (errorBox) {
        errorBox.querySelector('p').textContent = err.message || 'Sai số điện thoại hoặc mật khẩu.';
        errorBox.style.display = 'flex';
      }
      btn.disabled = false;
      btn.textContent = 'ĐĂNG NHẬP';
    }
  }
})();
</script>

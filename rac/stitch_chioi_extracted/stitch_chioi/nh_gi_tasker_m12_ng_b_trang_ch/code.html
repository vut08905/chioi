<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #fff8f6; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
        .orange-gradient { background: linear-gradient(135deg, #ff7e36 0%, #a04100 100%); }
        .bg-top-gradient {
            background: linear-gradient(to bottom, #ff7e36 0%, rgba(255, 126, 54, 0) 300px);
        }
    </style>

<body class="text-on-surface antialiased">
<!-- Full Screen Container -->
<div class="min-h-screen flex flex-col relative bg-top-gradient">
<!-- TopAppBar -->
<header class="h-16 flex justify-between items-center px-container-padding sticky top-0 z-50">
<button class="flex items-center justify-center w-10 h-10 active:scale-95 transition-all">
<span class="material-symbols-outlined text-on-primary">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-primary">Đánh giá chất lượng</h1>
<div class="w-10"></div> <!-- Placeholder for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow p-container-padding flex flex-col items-center pb-32">
<!-- Tasker Info Section -->
<section class="w-full flex flex-col items-center mt-lg mb-xl">
<div class="relative mb-md">
<img alt="Nguyen Lan" class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-lg" data-alt="A professional Vietnamese domestic worker smiling warmly at the camera. She has short black hair and is wearing a neat uniform. The background is a brightly lit, clean modern living room in soft warm tones, reflecting a trustworthy and professional service atmosphere. High-quality portrait photography with soft natural lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD1zgrrrdCwuLFh4GRBurl8Y8XliovoJnJyP3sHQhvgAkw3pDCYzgbtwR26ZIT8i8Eiicti6wbMVWaVBeAeJDTmUNlU50wm8WtkyTUP6abCk3fBCbodk7XIWnaoMAEuiiZRLc6UI9m7GuTYo3PnIieXat_6gy1rZKOMvsQdrQf3fSLxT5q_BohFLqw07KUxXi37P966OkiroFjCDtf8qz0AdzFzyw2354kdLjx9dV124IqyMa9PLqqP6FVKIaEnJaa_kcSUMkcVWy8"/>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">Nguyễn Lan</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-xs">Dịch vụ Dọn dẹp nhà · Ngày 20/10</p>
</section>
<!-- Star Rating Section -->
<section class="w-full flex flex-col items-center mb-xl">
<div class="flex gap-sm mb-md">
<span class="material-symbols-outlined text-primary-container text-[48px] filled-icon">star</span>
<span class="material-symbols-outlined text-primary-container text-[48px] filled-icon">star</span>
<span class="material-symbols-outlined text-outline-variant text-[48px]">star</span>
<span class="material-symbols-outlined text-outline-variant text-[48px]">star</span>
<span class="material-symbols-outlined text-outline-variant text-[48px]">star</span>
</div>
<!-- Simulated 2-star feedback message -->
<div class="bg-surface-container-low px-md py-sm rounded-xl border border-primary-container/20 max-w-xs text-center shadow-sm">
<p class="font-body-sm text-body-sm text-primary">Rất tiếc về trải nghiệm của bạn. Chị Ơi sẽ xử lý sự cố này.</p>
</div>
</section>
<!-- Quick Selection Tags -->
<section class="w-full flex flex-wrap justify-center gap-sm mb-xl">
<button class="px-md py-base rounded-full bg-white text-on-secondary-container font-label-caps text-label-caps border border-outline-variant shadow-sm hover:bg-primary-container/10 transition-all">ĐÚNG GIỜ</button>
<button class="px-md py-base rounded-full bg-white text-on-secondary-container font-label-caps text-label-caps border border-outline-variant shadow-sm hover:bg-primary-container/10 transition-all">SẠCH SẼ</button>
<button class="px-md py-base rounded-full bg-white text-on-secondary-container font-label-caps text-label-caps border border-outline-variant shadow-sm hover:bg-primary-container/10 transition-all">NHIỆT TÌNH</button>
</section>
<!-- Textarea Feedback -->
<section class="w-full mb-xl">
<label class="block font-title-sm text-title-sm text-on-surface mb-sm" for="feedback">Nhận xét của bạn</label>
<textarea class="w-full p-md bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/50 transition-all shadow-sm" id="feedback" placeholder="Chia sẻ thêm về trải nghiệm của bạn..." rows="4"></textarea>
</section>
<!-- Submit Button (Now part of main scrollable area, visually distinct) -->
<button class="w-full h-14 orange-gradient text-on-primary font-title-sm text-title-sm rounded-full shadow-lg active:scale-95 transition-all flex items-center justify-center gap-sm mb-8">
                Gửi đánh giá
            </button>
</main>
<!-- Floating Pill Navigation Footer -->
<nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-48px)] max-w-md h-16 bg-white/90 backdrop-blur-md border border-outline-variant/30 rounded-full shadow-2xl flex items-center justify-around px-4 z-[100]">
<a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">home</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Trang chủ</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">history</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Hoạt động</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">notifications</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Thông báo</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">person</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Tài khoản</span>
</a>
</nav>
</div>

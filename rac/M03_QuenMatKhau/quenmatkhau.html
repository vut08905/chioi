<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quên mật khẩu - Pro-Clean Home Services</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#fff1eb",
                        "surface": "#fff8f6",
                        "surface-dim": "#ecd6cc",
                        "surface-variant": "#f4ded5",
                        "surface-bright": "#fff8f6",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#ffdbcc",
                        "tertiary": "#006780",
                        "surface-container-high": "#fae4da",
                        "surface-tint": "#a04100",
                        "tertiary-fixed": "#b8eaff",
                        "inverse-surface": "#3b2e28",
                        "secondary-container": "#feb28e",
                        "tertiary-fixed-dim": "#52d5ff",
                        "on-background": "#241914",
                        "on-primary": "#ffffff",
                        "background": "#fff8f6",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#ffb693",
                        "surface-container-highest": "#f4ded5",
                        "primary-fixed": "#ffdbcc",
                        "primary-container": "#ff7e36",
                        "outline": "#8b7266",
                        "on-tertiary-fixed-variant": "#004d61",
                        "on-surface-variant": "#584238",
                        "on-error": "#ffffff",
                        "on-primary-container": "#642600",
                        "secondary": "#895032",
                        "on-primary-fixed-variant": "#7a3000",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#ffeae1",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#00b1da",
                        "inverse-on-surface": "#ffede6",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#351000",
                        "primary": "#a04100",
                        "secondary-fixed-dim": "#ffb693",
                        "outline-variant": "#dfc0b3",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#001f28",
                        "on-tertiary-container": "#003f4f",
                        "on-secondary-fixed-variant": "#6d391d",
                        "primary-fixed-dim": "#ffb693",
                        "on-secondary-fixed": "#351000",
                        "on-secondary-container": "#794226",
                        "on-surface": "#241914"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "xl": "32px",
                        "container-padding": "16px",
                        "stack-gap": "12px",
                        "base": "4px",
                        "md": "16px",
                        "sm": "8px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "headline-md": ["Be Vietnam Pro"],
                        "label-caps": ["Be Vietnam Pro"],
                        "display-lg": ["Be Vietnam Pro"],
                        "body-sm": ["Be Vietnam Pro"],
                        "title-sm": ["Be Vietnam Pro"],
                        "body-lg": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "title-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #fcf9f8;
        }
        .orange-gradient {
            background: linear-gradient(135deg, #FF7E36 0%, #A04100 100%);
        }
        .shadow-soft {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus {
            outline: none;
            border-color: #ff7e36 !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background min-h-screen">
<!-- Top AppBar Component (Injected Styles from JSON logic) -->
<header class="orange-gradient fixed top-0 left-0 right-0 z-50 shadow-md h-16 flex justify-between items-center px-container-padding">
<button class="flex items-center justify-center p-2 text-on-primary hover:bg-primary/20 rounded-full transition-all active:scale-95">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md text-on-primary text-center flex-1">Quên mật khẩu</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="pt-24 pb-12 px-container-padding max-w-md mx-auto space-y-xl">
<!-- Illustration / Context Section -->
<div class="flex justify-center mb-4">
<div class="w-32 h-32 rounded-full orange-gradient/10 flex items-center justify-center">
<span class="material-symbols-outlined text-[64px] text-primary" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
</div>
</div>
<!-- 1. Phone Input Section -->
<section class="space-y-md">
<div class="space-y-xs">
<p class="text-body-lg font-body-lg text-on-surface-variant">
                    Vui lòng nhập số điện thoại đã đăng ký để nhận mã OTP.
                </p>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="phone">phone</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border-none rounded-[16px] shadow-soft text-body-lg font-body-lg focus:ring-2 focus:ring-primary/20 transition-all" placeholder="Số điện thoại" type="tel"/>
</div>
<button class="w-full h-12 rounded-full border-2 border-primary-container text-primary font-title-sm text-title-sm hover:bg-primary-container/10 active:scale-95 transition-all">
                Nhận mã OTP
            </button>
</section>
<!-- 2. OTP Limit Note -->
<section class="bg-error-container/30 border border-error-container p-md rounded-[16px]">
<div class="flex items-start gap-sm">
<span class="material-symbols-outlined text-error text-[20px]" data-icon="warning">warning</span>
<p class="text-body-sm font-body-sm text-on-error-container font-semibold leading-relaxed">
                    Giới hạn: Bạn chỉ được yêu cầu gửi lại mã tối đa 3 lần / 30 phút.
                </p>
</div>
</section>
<!-- 3. OTP Input Section -->
<section class="space-y-md">
<div class="space-y-xs">
<p class="text-body-lg font-body-lg text-on-surface-variant">
                    Mã OTP đã được gửi đến số <span class="text-on-surface font-bold">090****123</span>.
                </p>
<p class="text-body-sm font-body-sm text-outline italic">
                    (Hiệu lực: 5 phút)
                </p>
</div>
<!-- 6 OTP Boxes -->
<div class="grid grid-cols-6 gap-sm">
<input class="w-full h-14 bg-surface-container-lowest border-none rounded-[12px] shadow-soft text-center text-headline-md font-headline-md focus:ring-2 focus:ring-primary/20 transition-all" maxlength="1" type="text"/>
<input class="w-full h-14 bg-surface-container-lowest border-none rounded-[12px] shadow-soft text-center text-headline-md font-headline-md focus:ring-2 focus:ring-primary/20 transition-all" maxlength="1" type="text"/>
<input class="w-full h-14 bg-surface-container-lowest border-none rounded-[12px] shadow-soft text-center text-headline-md font-headline-md focus:ring-2 focus:ring-primary/20 transition-all" maxlength="1" type="text"/>
<input class="w-full h-14 bg-surface-container-lowest border-none rounded-[12px] shadow-soft text-center text-headline-md font-headline-md focus:ring-2 focus:ring-primary/20 transition-all" maxlength="1" type="text"/>
<input class="w-full h-14 bg-surface-container-lowest border-none rounded-[12px] shadow-soft text-center text-headline-md font-headline-md focus:ring-2 focus:ring-primary/20 transition-all" maxlength="1" type="text"/>
<input class="w-full h-14 bg-surface-container-lowest border-none rounded-[12px] shadow-soft text-center text-headline-md font-headline-md focus:ring-2 focus:ring-primary/20 transition-all" maxlength="1" type="text"/>
</div>
<div class="text-center">
<p class="text-body-sm font-body-sm text-outline">
                    Gửi lại mã sau <span class="text-primary font-bold">04:59s</span>
</p>
</div>
</section>
<!-- 4. Reset Password Section -->
<section class="space-y-md pt-lg border-t border-outline-variant">
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full h-14 pl-12 pr-12 bg-surface-container-lowest border-none rounded-[16px] shadow-soft text-body-lg font-body-lg focus:ring-2 focus:ring-primary/20 transition-all" placeholder="Mật khẩu mới" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="lock_clock">lock_clock</span>
<input class="w-full h-14 pl-12 pr-12 bg-surface-container-lowest border-none rounded-[16px] shadow-soft text-body-lg font-body-lg focus:ring-2 focus:ring-primary/20 transition-all" placeholder="Nhập lại mật khẩu mới" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<!-- CTA Button -->
<button class="orange-gradient w-full h-14 rounded-full text-on-primary font-headline-md text-title-sm shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center mt-xl">
                Lưu mật khẩu &amp; Đăng nhập
            </button>
</section>
</main>
<!-- Visual Polish: Soft Decorative Shapes -->
<div class="fixed -bottom-20 -left-20 w-64 h-64 bg-primary-container/10 rounded-full blur-3xl -z-10"></div>
<div class="fixed -top-20 -right-20 w-64 h-64 bg-secondary-container/10 rounded-full blur-3xl -z-10"></div>
</body></html>

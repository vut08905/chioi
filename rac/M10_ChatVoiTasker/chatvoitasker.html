<style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #fff8f6;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .message-gradient {
            background: linear-gradient(135deg, #ff7e36 0%, #feb28e 100%);
        }
        .top-gradient {
            background: linear-gradient(to bottom, #a04100 0%, #ff7e36 150px, transparent 300px);
        }
    </style>

<body class="text-on-background min-h-screen flex flex-col relative">
<!-- Background Gradient Overlay -->
<div class="fixed inset-0 pointer-events-none top-gradient z-0"></div>
<!-- Top AppBar (Transparent) -->
<header class="fixed top-0 left-0 right-0 z-50 bg-transparent h-16 px-container-padding flex justify-between items-center">
<div class="flex items-center gap-3">
<button class="text-on-primary active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-[28px]">arrow_back</span>
</button>
<div class="flex items-center gap-2">
<div class="relative">
<img alt="Nguyễn Lan" class="w-10 h-10 rounded-full object-cover border-2 border-white/20" data-alt="A professional headshot of a friendly female home service provider with a warm smile, set against a soft, clean interior background. The image has high-key lighting, emphasizing a bright and trustworthy atmosphere that aligns with a premium cleaning service application aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJttHSEkguhTyzRh5F2ob_sSOVWpJBMVixISI7gtZTKFB19e_taBaPGdgEXGUG64JrvzME-w2Jem_nBDlsiWgD6AoprmNiRMY1Rx6RwyODOw8pDbPImhTOe_3qcksFnWIMm3R2QmHwaI6lMrAFcZ7Xf-NjbZc4rtV7rAjDLG9mgsO6kR-9oTi0BEylOWot8csFv8DFW6AY5J2VtZqIbPjveRbvCDX-g48qTwVuqmCtm2UqL-KJpLicg5H07-pCWmePm5rCSdqWdww"/>
<div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-primary rounded-full"></div>
</div>
<div>
<h1 class="text-on-primary font-headline-md text-title-sm leading-tight">Nguyễn Lan</h1>
<p class="text-on-primary/80 text-label-caps font-label-caps">Đang trực tuyến</p>
</div>
</div>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white/20 backdrop-blur-md text-on-primary active:scale-95 transition-all">
<span class="material-symbols-outlined">call</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 mt-16 mb-44 flex flex-col relative z-10">
<!-- Pinned Order Card -->
<div class="sticky top-0 z-40 bg-white/90 backdrop-blur-sm px-container-padding py-3 shadow-sm flex items-center justify-between mx-md mt-sm rounded-xl border border-outline-variant/30">
<div class="flex items-center gap-3">
<div class="bg-primary p-2 rounded-lg">
<span class="material-symbols-outlined text-on-primary text-[20px]">cleaning_services</span>
</div>
<span class="text-on-surface font-title-sm text-[14px]">Đơn: Dọn nhà · 20/10 · Đang TH</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
<!-- Chat Area -->
<div class="flex-1 p-container-padding space-y-stack-gap">
<!-- Timestamp -->
<div class="flex justify-center my-lg">
<span class="bg-surface-variant text-on-surface-variant text-label-caps font-label-caps px-3 py-1 rounded-full">HÔM NAY, 10:12</span>
</div>
<!-- Tasker Message -->
<div class="flex items-end gap-2 max-w-[85%]">
<div class="w-8 h-8 rounded-full overflow-hidden flex-shrink-0">
<img alt="Tasker Avatar" data-alt="Close up portrait of a helpful service staff member, professionally dressed, representing trust and quality. The lighting is soft and warm, highlighting the friendly facial features of the provider." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDp0AMkdp9J-tNcIUJtwnOMBfpX51COrXyODojRYUp6GLxzr4a3vFDpdrNtJANGZRzXmQh1yRf60KIdC0jx54Xoc76RAEliZk8bY8VoMluPv8uIy3FYuQuxWO76Yry1aTURwYn_ncCcGlfnxFYFZL-jPNxWn41Hj1XXKT81bLHdDWDw3bqz8v-X6Ewhr7ZoHLPeZXiSf-gDiQ_Dl4HkQn7ZyPCupvXjLSGyPeqeA-14ceRtMpVN2Tou8jvjmXJR5aG5m2VSbEnEzJU"/>
</div>
<div class="bg-surface-container-high text-on-surface p-3 rounded-2xl rounded-bl-none shadow-sm">
<p class="text-body-lg">Chào chị, em đang trên đường đến ạ!</p>
<p class="text-[10px] text-on-surface-variant mt-1">10:12</p>
</div>
</div>
<!-- User Message -->
<div class="flex flex-col items-end gap-1">
<div class="message-gradient text-on-primary p-3 rounded-2xl rounded-br-none shadow-md max-w-[80%]">
<p class="text-body-lg">Dạ, chị chờ em nhé</p>
<div class="flex items-center justify-end gap-1 mt-1">
<p class="text-[10px] text-on-primary/80">10:15</p>
<span class="material-symbols-outlined text-[14px]">done_all</span>
</div>
</div>
</div>
<!-- Tasker Message (Text) -->
<div class="flex items-end gap-2 max-w-[85%]">
<div class="w-8 h-8 rounded-full overflow-hidden flex-shrink-0 opacity-0"></div>
<div class="bg-surface-container-high text-on-surface p-3 rounded-2xl shadow-sm">
<p class="text-body-lg">Em đến rồi ạ!</p>
<p class="text-[10px] text-on-surface-variant mt-1">10:20</p>
</div>
</div>
<!-- Tasker Message (Image) -->
<div class="flex items-end gap-2 max-w-[85%]">
<div class="w-8 h-8 rounded-full overflow-hidden flex-shrink-0">
<img alt="Tasker Avatar" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDmfBKWggIUrBwJYSIed5ZPY1uh-SddyWqg1ysInhfnrfoFDQResefYh5e0yYbH9bscEP3C3y2XN9pjlTE79oT_k6W-1x3e5SRgfk5FYRGu8C8bOJa4nkAii1z7gvevNA4gMIVPdu3cKznTDImBK6qRmCIoE19A8EsYdQPmGvDwx288w0FmF5XV9VNFBJN2K4aEI0j9XYj-K-zcrSHqIr9h3UL1yh1clvZM2hVaJaFrkzI_NYBkJZ6tTvBAQh-t9jUqrpWUBho6x6A"/>
</div>
<div class="bg-surface-container-high p-2 rounded-2xl rounded-bl-none shadow-sm">
<div class="rounded-xl overflow-hidden mb-1">
<img alt="Arrival Photo" class="w-48 h-32 object-cover" data-alt="A brightly lit, modern apartment hallway with clean wooden floors and white walls, symbolizing the arrival of a cleaning service at a professional residential location. High-key natural lighting fills the space, creating a fresh and welcoming vibe." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDAqWLDt8QFYJn8lVyDaDCMoiOb86FHYGPmPABp-A_bplb-egkTjMSU6ke3dhv4GtAKd__qsL6ovcAM_que-z05kWUo88iAYoUBDQM4Z3LA_jFne_mNC48PVit9TyCZkcWjgI3UoiDA4cZUJ7ln9syKTT2XWCYykiqpynOpP3RRgbYYvnSk-PZyHQwcWuAlIF-SBZWFjX1Y89sKHnQ0GKdW9kXDTVXyR43ksr2DHOtS64Ff5pH79vL8YDYQ-37Cbp5UkdgQ08evlfw"/>
</div>
<p class="text-[10px] text-on-surface-variant text-right">10:20</p>
</div>
</div>
<!-- User Message -->
<div class="flex flex-col items-end gap-1">
<div class="message-gradient text-on-primary p-3 rounded-2xl rounded-br-none shadow-md max-w-[80%]">
<p class="text-body-lg">Ok em, chị ra mở cửa</p>
<div class="flex items-center justify-end gap-1 mt-1">
<p class="text-[10px] text-on-primary/80">10:21</p>
<span class="material-symbols-outlined text-[14px]">done_all</span>
</div>
</div>
</div>
</div>
</main>
<!-- Message Input Bar (Fixed above bottom nav) -->
<div class="fixed bottom-[100px] left-0 right-0 px-md py-sm z-50">
<div class="bg-surface-container-lowest shadow-lg rounded-full flex items-center p-2 gap-2 border border-outline-variant/20">
<button class="w-10 h-10 flex items-center justify-center text-outline active:scale-95 transition-all">
<span class="material-symbols-outlined">image</span>
</button>
<button class="w-10 h-10 flex items-center justify-center text-outline active:scale-95 transition-all">
<span class="material-symbols-outlined">photo_camera</span>
</button>
<div class="flex-1 h-10">
<input class="w-full h-full bg-transparent border-none focus:ring-0 text-body-lg px-2 placeholder:text-outline-variant" placeholder="Nhập tin nhắn..." type="text"/>
</div>
<button class="w-10 h-10 flex items-center justify-center bg-primary text-on-primary rounded-full shadow-md active:scale-90 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>
<!-- Floating Pill Bottom Navigation (From Homepage style) -->
<div class="fixed bottom-6 left-md right-md z-50 flex justify-center">
<nav class="flex items-center justify-around w-full max-w-md h-16 bg-surface-container-lowest/90 backdrop-blur-md rounded-full shadow-xl border border-outline-variant/20 px-4">
<button class="flex flex-col items-center justify-center flex-1 text-on-surface-variant/70 active:scale-95 transition-all">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-semibold mt-1">Trang chủ</span>
</button>
<button class="flex flex-col items-center justify-center flex-1 text-primary active:scale-95 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">history</span>
<span class="text-[10px] font-semibold mt-1">Hoạt động</span>
</button>
<button class="flex flex-col items-center justify-center flex-1 text-on-surface-variant/70 active:scale-95 transition-all">
<span class="material-symbols-outlined">notifications</span>
<span class="text-[10px] font-semibold mt-1">Thông báo</span>
</button>
<button class="flex flex-col items-center justify-center flex-1 text-on-surface-variant/70 active:scale-95 transition-all">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-semibold mt-1">Tài khoản</span>
</button>
</nav>
</div>
</body></html>

<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "error-container": "#ffdad6",
                    "inverse-on-surface": "#ffede6",
                    "secondary": "#895032",
                    "on-tertiary": "#ffffff",
                    "on-primary-container": "#642600",
                    "on-tertiary-fixed": "#001f28",
                    "on-tertiary-fixed-variant": "#004d61",
                    "on-surface": "#241914",

                    "tertiary-fixed": "#b8eaff",
                    "primary": "#a04100",
                    "secondary-fixed": "#ffdbcc",
                    "on-secondary-container": "#794226",
                    "surface-variant": "#f4ded5",
                    "background": "#fff8f6",
                    "surface-bright": "#fff8f6",
                    "surface-tint": "#a04100",
                    "outline-variant": "#dfc0b3",
                    "error": "#ba1a1a",
                    "on-primary-fixed": "#351000",
                    "tertiary": "#006780",
                    "outline": "#8b7266",
                    "on-primary-fixed-variant": "#7a3000",
                    "on-surface-variant": "#584238",
                    "surface-container-low": "#fff1eb",
                    "primary-fixed-dim": "#ffb693",
                    "on-secondary": "#ffffff",

                    "primary-fixed": "#ffdbcc",
                    "tertiary-fixed-dim": "#52d5ff",

                    "on-secondary-fixed-variant": "#6d391d",
                    "secondary-fixed-dim": "#ffb693",

                    "on-error-container": "#93000a",

                    "on-primary": "#ffffff"

            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xl": "32px",
                    "xs": "4px",
                    "md": "16px",
                    "lg": "24px",
                    "container-padding": "16px",
                    "sm": "8px",
                    "stack-gap": "12px",
                    "base": "4px"
            },
            "fontFamily": {
                    "label-caps": ["Be Vietnam Pro"],
                    "headline-md": ["Be Vietnam Pro"],
                    "display-lg": ["Be Vietnam Pro"],
                    "body-lg": ["Be Vietnam Pro"],

                    "body-sm": ["Be Vietnam Pro"]
            },
            "fontSize": {
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],

                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]

          }
        }
      }

<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .header-gradient {
            background: linear-gradient(to right, #a04100, #ff7e36);
            height: 300px;
        }
        .order-card {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            border: 1px solid #ffdbcc;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen pb-24">
<!-- Header Section -->
<header class="header-gradient relative w-full pt-12 px-md overflow-hidden">
<div class="flex justify-between items-center w-full px-md h-16">
<h1 class="text-headline-md font-headline-md font-bold text-on-primary">Lịch sử đơn hàng</h1>
<div class="flex gap-4">
<button class="text-on-primary/80 hover:opacity-90 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button class="text-on-primary/80 hover:opacity-90 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
</div>
</div>
<!-- Abstract Decoration for Premium Feel -->
<div class="absolute -right-10 -bottom-10 w-48 h-48 bg-white/10 rounded-full blur-3xl"></div>
</header>
<!-- Main Content -->
<main class="-mt-44 px-md relative z-10">
<!-- Filter Row -->
<div class="flex gap-sm overflow-x-auto pb-4 no-scrollbar">
<button class="flex items-center gap-1 px-4 py-2 bg-surface-container-low border border-outline-variant rounded-full text-body-sm text-on-surface-variant hover:bg-surface-container-high transition-colors whitespace-nowrap">
                Tháng này
                <span class="material-symbols-outlined text-[16px]" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</button>
<button class="flex items-center gap-1 px-4 py-2 bg-surface-container-low border border-outline-variant rounded-full text-body-sm text-on-surface-variant hover:bg-surface-container-high transition-colors whitespace-nowrap">
                Tất cả dịch vụ
                <span class="material-symbols-outlined text-[16px]" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</button>
<button class="flex items-center gap-1 px-4 py-2 bg-surface-container-low border border-outline-variant rounded-full text-body-sm text-on-surface-variant hover:bg-surface-container-high transition-colors whitespace-nowrap">
                Đánh giá
                <span class="material-symbols-outlined text-[16px]" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</button>
</div>
<!-- Orders List -->
<div class="flex flex-col gap-md mt-2">
<!-- Card 1 -->
<div class="order-card bg-surface-container-lowest rounded-xl p-md flex flex-col gap-3">
<div class="flex justify-between items-start">
<div>
<h3 class="text-title-sm font-title-sm text-on-surface">Dọn dẹp nhà cửa</h3>
<p class="text-body-sm text-on-surface-variant flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[14px]" data-icon="schedule">schedule</span>
                            14:00 - 12/05/2026
                        </p>
</div>
<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-label-caps font-bold">Hoàn thành</span>
</div>
<div class="flex items-center justify-between border-t border-dashed border-outline-variant pt-3">
<span class="text-headline-md font-headline-md text-primary">150.000 đ</span>
<div class="flex items-center gap-2">
<img class="w-8 h-8 rounded-full border-2 border-primary-fixed" data-alt="A professional cleaning specialist profile photo, a friendly woman in her 30s wearing a clean professional polo shirt against a bright, warm domestic background. The lighting is soft and natural, emphasizing trust and cleanliness with warm orange color accents in the environment. Modern app aesthetic with professional photography style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCs-vgupGcfQLmB1ihPersCk1KVVdi30uRObCXf-TGBHo3xY0jdA5s_dUq1VWZjp9Uc5A3pPZOUDJHpaCJ8RMqkY9GjwoloBea3EmvlUhF8YqNLG2D_5YnSCPhG6yg-4eNT0mwBiTx8LPf8Ise-DfGnxw3fiMX5P0nxnL3M2C0hmruAb2r86KLdXyYrSIranbFJ2j1IGeV71zVaJl-MVJU2M63xenJIR3ub4vRB6XEzl4rgSBhHqh2FnMapsRw10Nebqnb-oVGDgAA"/>
<span class="text-body-sm text-on-surface-variant">Chị Lan</span>
</div>
</div>
<div class="bg-surface-container-low rounded-lg p-3 mt-1">
<p class="text-body-sm text-on-surface flex items-center gap-1 italic">
<span class="text-yellow-500 font-bold tracking-tight">⭐⭐⭐⭐⭐</span>
                        "Làm rất sạch sẽ"
                    </p>
</div>
</div>
<!-- Card 2 -->
<div class="order-card bg-surface-container-lowest rounded-xl p-md flex flex-col gap-3">
<div class="flex justify-between items-start">
<div>
<h3 class="text-title-sm font-title-sm text-on-surface">Trông trẻ (2 giờ)</h3>
<p class="text-body-sm text-on-surface-variant flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[14px]" data-icon="schedule">schedule</span>
                            09:00 - 10/05/2026
                        </p>
</div>
<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-label-caps font-bold">Hoàn thành</span>
</div>
<div class="flex items-center justify-between border-t border-dashed border-outline-variant pt-3">
<span class="text-headline-md font-headline-md text-primary">200.000 đ</span>
<div class="flex items-center gap-2">
<img class="w-8 h-8 rounded-full border-2 border-primary-fixed" data-alt="A warm and caring childcare provider profile portrait. A middle-aged person with a kind smile, dressed in comfortable casual wear. The setting is a cozy, brightly lit nursery with soft orange and peach tones, maintaining a professional yet approachable atmosphere for a service app. High-quality portrait photography with a gentle blur in the background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAmcq4llYwgcK9uMi7t9odKFk6HYfnLm6o6rOhjImWfY6noFv4MnuweeZLz2_bevtLx9J7YDiVAHRgsp_jijCbNadEWF3m3LlhhjX_nvzF0FyZECDfeP99Uhw4UKeipP8a5EiG_MFE5z3zeJK6EB80KR-a2-O0UZY_29KblffthIKYyZhWWDqf6RO3bYDeU4gUcvXg8QJ6m88gJyh_7bg5jTwf3t2xVbSBHNuUrwQOov_4r8UfqCXIhqDPlUIui1Pb-GCpZC6ZU1uA"/>
<span class="text-body-sm text-on-surface-variant">Chị Mai</span>
</div>
</div>
<div class="bg-surface-container-low rounded-lg p-3 mt-1">
<p class="text-body-sm text-on-surface flex items-center gap-1 italic">
<span class="text-yellow-500 font-bold tracking-tight">⭐⭐⭐⭐</span>
                        "Tốt, đúng giờ"
                    </p>
</div>
</div>
<!-- Empty space for better layout rhythm -->
<div class="h-4"></div>
<!-- Service Banner -->
<div class="relative overflow-hidden rounded-2xl bg-primary h-32 flex items-center p-md">
<div class="z-10">
<h4 class="text-on-primary font-bold text-title-sm">Cần người hỗ trợ thêm?</h4>
<button class="mt-2 px-4 py-1.5 bg-white text-primary text-label-caps rounded-full font-bold shadow-lg">Đặt ngay</button>
</div>
<div class="absolute right-0 top-0 h-full opacity-30">
<span class="material-symbols-outlined text-[120px] translate-x-1/4 translate-y-1/4" data-icon="cleaning_services">cleaning_services</span>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Bar (Floating Pill Layout) -->
<nav class="fixed bottom-6 left-md right-md z-50">
<div class="bg-surface dark:bg-surface-dim shadow-[0_-4px_15px_rgba(0,0,0,0.08)] rounded-full h-20 px-4 flex justify-around items-center border border-outline-variant/30 backdrop-blur-md">
<!-- Trang chủ -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-1 rounded-full">
<span class="material-symbols-outlined text-xl" data-icon="home">home</span>
<span class="text-label-caps font-label-caps mt-1">Trang chủ</span>
</button>
<!-- Lịch sử (Active) -->
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-full px-4 py-1 scale-100 transition-all duration-200">
<span class="material-symbols-outlined text-xl" data-icon="history" style="font-variation-settings: 'FILL' 1;">history</span>
<span class="text-label-caps font-label-caps mt-1 font-bold">Lịch sử</span>
</button>
<!-- Thống kê -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-1 rounded-full">
<span class="material-symbols-outlined text-xl" data-icon="bar_chart">bar_chart</span>
<span class="text-label-caps font-label-caps mt-1">Thống kê</span>
</button>
<!-- Cá nhân -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-1 rounded-full">
<span class="material-symbols-outlined text-xl" data-icon="person">person</span>
<span class="text-label-caps font-label-caps mt-1">Cá nhân</span>
</button>
</div>
</nav>
</body></html>

<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng nhập Tasker | Chị Ơi!</title>

                        "stack-gap": "12px",
                        "base": "4px",
                        "xs": "4px",
                        "xl": "32px",
                        "lg": "24px"

                        "label-caps": ["Be Vietnam Pro"],

<style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #fff8f6;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .primary-gradient {
            background: linear-gradient(135deg, #a04100 0%, #ff7e36 100%);
        }
        .soft-card-shadow {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }
        .nav-pill-shadow {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start overflow-x-hidden pb-24">
<!-- Top Section: Header & Branding -->
<header class="w-full h-[260px] primary-gradient relative flex flex-col items-center justify-center overflow-hidden">
<!-- Decorative elements -->
<div class="absolute -top-20 -right-20 w-64 h-64 bg-white opacity-10 rounded-full blur-3xl"></div>
<div class="absolute -bottom-20 -left-20 w-80 h-80 bg-orange-300 opacity-20 rounded-full blur-3xl"></div>
<div class="relative z-10 text-center px-container-padding">
<h1 class="font-display-lg text-display-lg text-white mb-2">Chị Ơi!</h1>
<p class="font-body-lg text-body-lg text-white/90">Dịch vụ tiện ích tại gia</p>
</div>
</header>
<!-- Main Login Content -->
<main class="w-full max-w-md px-container-padding -mt-10 z-20">
<div class="bg-surface-container-lowest rounded-[32px] p-8 soft-card-shadow border border-surface-container">
<!-- Input Group -->
<div class="space-y-6">
<!-- Phone Number -->
<div class="space-y-2">
<label class="text-on-surface-variant font-label-caps block ml-2">Số điện thoại</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline">call</span>
<input class="w-full bg-surface-bright border border-surface-variant rounded-xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-primary focus:border-transparent outline-none text-body-lg transition-all" placeholder="Nhập số điện thoại" type="tel"/>
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="text-on-surface-variant font-label-caps block ml-2">Mật khẩu</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline">lock</span>
<input class="w-full bg-surface-bright border border-surface-variant rounded-xl py-4 pl-12 pr-12 focus:ring-2 focus:ring-primary focus:border-transparent outline-none text-body-lg transition-all" placeholder="Nhập mật khẩu" type="password"/>
<button class="absolute right-4 text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="flex justify-end">
<a class="text-primary font-body-sm hover:underline" href="#">Quên mật khẩu?</a>
</div>
</div>
<!-- Error Messages -->
<div class="space-y-3 pt-2">
<div class="flex items-start gap-2 bg-error-container/30 p-3 rounded-lg border border-error/10">
<span class="material-symbols-outlined text-error text-[20px]">error</span>
<p class="text-error text-body-sm leading-tight">Sai mật khẩu. Tài khoản sẽ bị khóa 15 phút sau 5 lần nhập sai.</p>
</div>
<div class="flex items-start gap-2 bg-tertiary-container/10 p-3 rounded-lg border border-tertiary/20">
<span class="material-symbols-outlined text-tertiary text-[20px]">info</span>
<p class="text-on-tertiary-container text-body-sm leading-tight">Tài khoản đang chờ Admin phê duyệt.</p>
</div>
</div>
<!-- 2FA Security Code -->
<div class="space-y-2 pt-2">
<label class="text-on-surface-variant font-label-caps block ml-2">Mã xác thực 2FA</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" data-weight="fill">shield</span>
<input class="w-full bg-surface-bright border border-surface-variant rounded-xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-primary focus:border-transparent outline-none text-body-lg transition-all tracking-widest font-bold" placeholder="Nhập mã bảo mật 6 số" type="text"/>
</div>
</div>
</div>
<!-- Login Action -->
<div class="mt-10">
<button class="w-full primary-gradient text-white py-5 rounded-full font-title-sm text-center shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
                    ĐĂNG NHẬP
                </button>
</div>
<!-- Footer Link -->
<div class="mt-8 text-center">
<p class="text-on-surface-variant text-body-sm">
                    Chưa có tài khoản? 
                    <a class="text-primary font-title-sm ml-1 hover:underline" href="#">Đăng ký Tasker</a>
</p>
</div>
</div>
</main>
<!-- Support Section -->
<section class="w-full max-w-md px-container-padding py-8 flex flex-col items-center mb-12">
<div class="flex items-center gap-4 p-4 rounded-2xl bg-surface-container-low/50 w-full border border-outline-variant/30">
<div class="w-12 h-12 rounded-full overflow-hidden flex-shrink-0">
<img alt="Support" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDZL_s5gc_EN6gBXPray0dBKYsH4lVqjNFBRsXYADu0FF8E3DnFpDqWlxeRqAEGSqBhOaqhGUDwlhjc7q7VN7am_Eccrhnmrqc1Q7tCD47FfqexdYE536GdkszL__VLdSppmIDFUwcC6dvZdSJfvBkhs854Hpv79dsoUDFct8Xxs4Gen-zJxMuSKoiUmsrZnETw7AjKB6lHHA4redj7pXysWG9g33bmKdFdvevlmRensklGDYT_Dxy9-xr8UVaElyS7VWOJXQjzGwY"/>
</div>
<div>
<p class="font-title-sm text-on-surface">Cần hỗ trợ?</p>
<p class="text-body-sm text-on-surface-variant">Liên hệ hotline: 1900 1234</p>
</div>
<button class="ml-auto w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">support_agent</span>
</button>
</div>
</section>
<!-- Floating Bottom Navigation -->
</body></html>
